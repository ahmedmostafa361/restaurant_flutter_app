name: Flutter CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7' # match your local `flutter --version`
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Filter coverage (exclude generated/UI files)
        run: |
          dart pub global activate remove_from_coverage
          dart pub global run remove_from_coverage -f coverage/lcov.info -r '\.g\.dart$'
          dart pub global run remove_from_coverage -f coverage/lcov.info -r 'di\.config\.dart$'
          dart pub global run remove_from_coverage -f coverage/lcov.info -r 'features/ui/'
          dart pub global run remove_from_coverage -f coverage/lcov.info -r 'main\.dart$'
          dart pub global run remove_from_coverage -f coverage/lcov.info -r 'gen/'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: coverage/lcov.info
          fail_ci_if_error: false